name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------
  # CI PRECHECK phases
  # ---------------------------------------------------------------------
  precheck-test:
    name: "CI Precheck: make functional-test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./backend/go.mod

      - name: Install Fish Shell
        uses: fish-shop/install-fish-shell@v1

      - name: Download Make Dependencies
        run: fish ./scripts/install-backend-build.fish

      - name: Run make
        run: make

      - name: Run make functional-test
        run: make functional-test

  precheck-govulncheck:
    name: "CI Precheck: govulncheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./backend/go.mod

      - name: Install Fish Shell
        uses: fish-shop/install-fish-shell@v1

      - name: Download Make Dependencies
        run: fish ./scripts/install-backend-build.fish

      - name: Run make
        run: make

      - name: Install govulncheck
        run: fish ./scripts/install-backend-check.fish

      - name: Run govulncheck
        run: cd backend && govulncheck ./...

  # ---------------------------------------------------------------------
  # CI BUILD phases (4 total: migrator + 3 apps,
  # frontend/api/consumer = 3 app builds, migrator = 1, total build jobs = 4.
  # ---------------------------------------------------------------------
  build-migrator:
    name: "CI Build: migrator"
    runs-on: ubuntu-latest
    needs: [precheck-test, precheck-govulncheck]
    env:
      SVC: migrator
      DOCKERFILE: Migrator
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fish Shell
        uses: fish-shop/install-fish-shell@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & push image
        run: fish ./scripts/ecr-push-image.fish

  build-frontend:
    name: "CI Build: frontend"
    needs: [precheck-test, precheck-govulncheck]
    runs-on: ubuntu-latest
    env:
      SVC: frontend
      DOCKERFILE: Frontend
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fish Shell
        uses: fish-shop/install-fish-shell@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & push image
        run: fish ./scripts/ecr-push-image.fish

  build-api:
    name: "CI Build: api"
    needs: [precheck-test, precheck-govulncheck]
    runs-on: ubuntu-latest
    env:
      SVC: api
      DOCKERFILE: BackendService
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fish Shell
        uses: fish-shop/install-fish-shell@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & push image
        run: fish ./scripts/ecr-push-image.fish

  build-consumer:
    name: "CI Build: consumer"
    needs: [precheck-test, precheck-govulncheck]
    runs-on: ubuntu-latest
    env:
      SVC: consumer
      DOCKERFILE: BackendService
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fish Shell
        uses: fish-shop/install-fish-shell@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & push image
        run: fish ./scripts/ecr-push-image.fish

  # ---------------------------------------------------------------------
  # CD: Infra UAT (terraform plan -> manual approval -> apply -auto-approve)
  # ---------------------------------------------------------------------
  infra-uat:
    name: "CD: Infra UAT"
    uses: ./.github/workflows/deploy-plan-apply.yml
    with:
      working_directory: terraform/infra/uat
      environment_name: infra-uat-approval
    secrets: inherit

  # ---------------------------------------------------------------------
  # CD: Migrator deployment (UAT) - depends on migrator build
  # ---------------------------------------------------------------------
  deploy-migrator-uat:
    name: "CD: Migrator UAT"
    needs: [build-migrator, infra-uat]
    uses: ./.github/workflows/deploy-plan-apply.yml
    with:
      working_directory: terraform/app/migrator/uat
      environment_name: migrator-uat-approval
    secrets: inherit

  # ---------------------------------------------------------------------
  # CD: App phases - consumer -> api -> frontend, each blue rollout
  # ---------------------------------------------------------------------
  deploy-consumer-uat:
    name: "CD: Consumer UAT"
    needs: deploy-migrator-uat
    uses: ./.github/workflows/deploy-plan-apply.yml
    with:
      working_directory: terraform/app/consumer/uat
      environment_name: consumer-uat-approval
      tf_var_rollout: blue
      tf_var_commit_sha: ${{ github.sha }}
    secrets: inherit

  deploy-api-uat:
    name: "CD: API UAT"
    needs: deploy-consumer-uat
    uses: ./.github/workflows/deploy-plan-apply.yml
    with:
      working_directory: terraform/app/api/uat
      environment_name: api-uat-approval
      tf_var_rollout: blue
      tf_var_commit_sha: ${{ github.sha }}
    secrets: inherit

  deploy-frontend-uat:
    name: "CD: Frontend UAT"
    needs: deploy-api-uat
    uses: ./.github/workflows/deploy-plan-apply.yml
    with:
      working_directory: terraform/app/frontend/uat
      environment_name: frontend-uat-approval
      tf_var_rollout: blue
      tf_var_commit_sha: ${{ github.sha }}
    secrets: inherit