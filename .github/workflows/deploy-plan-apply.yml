name: Terraform Plan & Apply (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the terraform root module"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment name gating the apply step (configure required reviewers on this environment)"
        required: true
        type: string
      tf_var_rollout:
        description: "Optional value for TF_VAR_rollout"
        required: false
        type: string
        default: ""
      tf_var_commit_sha:
        description: "Optional value for TF_VAR_commit_sha"
        required: false
        type: string
        default: ""

env:
  AWS_REGION: us-east-1

jobs:
  plan:
    name: "plan (${{ inputs.working_directory }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      TF_VAR_rollout: ${{ inputs.tf_var_rollout }}
      TF_VAR_commit_sha: ${{ inputs.tf_var_commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Replace with your actual AWS auth method
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Show Plan (printed to job log + summary)
        run: |
          terraform show -no-color tfplan | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment_name }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1

  apply:
    name: "apply (${{ inputs.working_directory }})"
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      TF_VAR_rollout: ${{ inputs.tf_var_rollout }}
      TF_VAR_commit_sha: ${{ inputs.tf_var_commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment_name }}
          path: ${{ inputs.working_directory }}

      # Applying the saved plan file (rather than re-planning) guarantees
      # what gets applied is exactly what the reviewer approved.
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan