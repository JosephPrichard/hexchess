version: "1"

networks:
  observability:
    driver: bridge

volumes:
  redis_data:
    driver: local
  localstack-data:
    driver: local
  postgres_data:
    driver: local

services:
  # Postgres - primary SOR for website metadata
  postgres:
    image: postgres:16-alpine
    container_name: hexchess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hurricane123
      POSTGRES_DB: hexachess2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis - primary SOR for game state & cache
  redis:
    image: redis/redis-stack-server
    container_name: hexchess-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Redis - message delivery and broadcasting
  redis-pubsub:
    image: redis/redis-stack-server
    container_name: hexchess-redis-pubsub
    ports:
      - "6579:6379"