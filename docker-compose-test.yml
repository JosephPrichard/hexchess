services:
  test-redis:
    container_name: test-redis
    image: redis:7.2.0
    ports:
      - "20121:6379"

  test-localstack:
    container_name: test-localstack
    image: localstack/localstack:3.0
    ports:
      - "30121:4566"
    environment:
      SERVICES: "s3"
      DEBUG: "0"

  test-postgres:
    container_name: test-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "40121:5432"

  test-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: test-elasticsearch
    environment:
      node.name: es01
      cluster.name: it-cluster
      discovery.seed_providers: settings
      discovery.seed_hosts: es01
      cluster.initial_master_nodes: es01
      xpack.security.enabled: "false" # tests only
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "50121:9200"