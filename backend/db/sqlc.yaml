version: "2"
sql:
  - engine: "postgresql"
    queries: "./queries/primary"
    schema: "./schema-primary.sql"
    gen:
      go:
        package: "primarydb"
        sql_package: "pgx/v5"
        out: "./primarydb"
        emit_interface: true
  - engine: "postgresql"
    queries: "./queries/metrics"
    schema: "./schema-metrics.sql"
    gen:
      go:
        package: "metricsdb"
        sql_package: "pgx/v5"
        out: "./metricsdb"
        emit_interface: true
