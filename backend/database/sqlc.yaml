version: "2"
sql:
  - engine: "postgresql"
    queries: "./sql/query"
    schema: "./sql/schema.sql"
    gen:
      go:
        package: "query"
        sql_package: "pgx/v5"
        out: "./query"
        emit_interface: true
  - engine: "postgresql"
    queries: "./sql/mutate"
    schema: "./sql/schema.sql"
    gen:
      go:
        package: "mutate"
        sql_package: "pgx/v5"
        out: "./mutate"
        emit_interface: true