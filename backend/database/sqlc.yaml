version: "2"
sql:
  - engine: "postgresql"
    queries: "./queries/dql"
    schema: "./schema.sql"
    gen:
      go:
        package: "query"
        sql_package: "pgx/v5"
        out: "./query"
        emit_interface: true
  - engine: "postgresql"
    queries: "./queries/dml"
    schema: "./schema.sql"
    gen:
      go:
        package: "mutator"
        sql_package: "pgx/v5"
        out: "./mutator"
        emit_interface: true