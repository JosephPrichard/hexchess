syntax = "proto3";
option go_package = "hexchess-svc/pb";

package messages;

// user state

message PlayerState {
  int64 id = 1;
  string name = 2;
  string country = 3;
  double elo = 4;
  bool isGuest = 5;
}

// chess state

message PieceMove {
  int32 piece = 1;
  int32 fromFile = 2;
  int32 fromRank = 3;
  int32 toFile = 4;
  int32 toRank = 5;
}

message PieceMoves {
  int32 piece = 1;
  int32 fromFile = 2;
  int32 fromRank = 3;
  repeated int64 moves = 4;
}

message BoardFile {
  repeated uint32 pieces = 1;
}

message ChessBoard {
  bool is_white_turn = 1;
  repeated BoardFile file = 2;
}

message HistMove {
  int32 piece = 1;
  int32 from_file = 2;
  int32 from_rank = 3;
  int32 to_file = 4;
  int32 to_rank = 5;
  string notation = 6;
  int64 white_timer_ms = 7;
  int64 black_timer_ms = 8;
}

message ChessGame {
  ChessBoard board = 1;
  repeated PieceMoves white_moves = 2;
  repeated PieceMoves black_moves = 3;
  repeated int32 taken_white_pieces = 4;
  repeated int32 taken_black_pieces = 5;
  repeated HistMove moves = 6;
}

enum EndKind {
  NOT_ENDED = 0;
  FINISHED = 1;
  ABORTED = 2;
}

message ChessState {
  string id = 1;
  ChessGame game = 2;
  PlayerState white_player = 4;
  PlayerState black_player = 5;
  string first_color = 6;
  string mode = 7;
  int64 touch = 8;
  ChessBoard initial_board = 9;
  int64 undo_id = 10;
  EndKind end_state = 11;
}

message HistMoves {
  repeated HistMove moves = 1;
}

message PieceMoveList {
  repeated PieceMove moves = 1;
}

message MoveHistory {
  ChessGame initial_game = 1;
  repeated HistMove steps = 2;
}

// entities
message LbdUser {
  int64 id = 1;
  string username = 2;
  string country = 3;
  string bio = 4;
  string joined_on = 5;
  double elo = 6;
  double highest_elo = 7;
  int32 wins = 8;
  int32 losses = 9;
  int32 draws = 10;
  int64 winrate = 11;
  int64 rank = 12;
}

message TournamentMatch {
  int64 id = 1;
  string game_id = 2;
  string tournament_key = 3;
  int64 round = 4;
  string created_on = 5;
  int64 white_id = 6;
  int64 black_id = 7;
}

message MatchCreation {
  string game_id = 1;
  string mode = 2;
  int64 white_id = 3;
  int64 black_id = 4;
}

message MatchCreations {
  repeated MatchCreation creations = 1;
}

message Challenge {
  int64 challenger_id = 1;
  string challenger_name = 2;
  string challenger_country = 3;
  double challenger_elo = 4;
  int64 challengee_id = 5;
  string challengee_name = 6;
  string challengee_country = 7;
  double challengee_elo = 8;
  string mode = 9;
  string start_color = 10;
  string made_on = 11;
}

message Replay {
  int64 id = 1;
  int64 white_id = 2;
  int64 black_id = 3;
  string white_name = 4;
  string black_name = 5;
  string white_country = 6;
  string black_country = 7;
  string mode = 8;
  string result = 9;
  string cause = 10;
  double win_elo_diff = 11;
  double lose_elo_diff = 12;
  double white_elo = 13;
  double black_elo = 14;
  double white_elo_diff = 15;
  double black_elo_diff = 16;
  string played_on = 17;
}

// transit messages

message Move {
  int32 promotion = 1;
  int32 fromFile = 2;
  int32 fromRank = 3;
  int32 toFile = 4;
  int32 toRank = 5;
}

message ChatMessage {
  PlayerState player = 1;
  string message = 2;
  string sent_at = 3;
  string id = 4;
}

// game ws api

message ForfeitInput {}

message MoveInput {
  Move move = 1;
}

message ChatInput {
  string message = 1;
}

message UndoInput {
  string kind = 1;
}

message PingInput {}

message GameInput {
  string messageId = 1;
  oneof value {
    ForfeitInput forfeit = 2;
    MoveInput move = 3;
    ChatInput chat = 4;
    UndoInput undo = 5;
    PingInput ping = 6;
  }
}

message ErrorOutput {
  string message = 1;
}

message InitOutput {
  ChessState state = 1;
  PlayerState self = 2;
}

message PlayersOutput {
  PlayerState white_player = 1;
  PlayerState black_player = 2;
}

message MoveOutput {
  HistMove move = 1;
  ChessGame game = 2;
  string updated_at = 3;
}

message UndoOutput {
  string kind = 1;
  int64 undo_id = 2;
  ChessGame game = 3;
}

message ForfeitOutput {
  EndKind end_state = 1;
}

message ReplayOutput {
  Replay replay = 1;
}

message GameOutputID {
  string game_id = 1;
  string message_id = 2;
}

message GameOutput {
  string game_id = 1;
  string message_id = 2;
  oneof value {
    ErrorOutput error = 3;
    InitOutput init = 4;
    PlayersOutput players = 5;
    MoveOutput move = 6;
    ChatMessage chat = 7;
    UndoOutput undo = 8;
    ForfeitOutput forfeit = 9;
    Replay replay = 10;
  }
}

// tournament ws api

message MatchmakingOutput {
  repeated TournamentMatch matches = 1;
}

message TournamentOutputID {
  string tournament_key = 1;
}

message BeginCountdownOutput {}

message StartTourneyOutput {}

message TournamentOutput {
  string tournament_key = 1;
  oneof value {
    ErrorOutput error = 2;
    LbdUser participant = 3;
    BeginCountdownOutput countdown = 4;
    MatchmakingOutput matchmaking = 5;
    StartTourneyOutput start = 6;
  }
}

// sse event messages

message UserMessage {
  int64 user_id = 1;
  oneof value {
    Challenge challenge = 2;
  }
}

message ChatMessages {
  repeated ChatMessage chats = 1;
}

// job queue events

message FinishGameEvent {
  string game_id = 1;
  ChessBoard board = 2;
  repeated HistMove moves = 3;
  int64 white_player = 4;
  int64 black_player = 5;
  string game_mode = 6;
  string replay_result = 7;
  string replay_cause = 8;
}

message UpdtMetadataEvent {
  string game_id = 1;
  int64 white_player = 2;
  int64 black_player = 3;
  string first_color = 4;
  string mode = 5;
}

message AdvanceTournamentEvent {
  string tournament_key = 1;
  string event_id = 2; // idempotency key
}