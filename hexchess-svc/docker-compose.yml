version: "1"

networks:
  elk:
    driver: bridge

volumes:
  redis_data:
    driver: local
  es_data:
    driver: local

services:
  redis:
    image: redis/redis-stack-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
  redis-pubsub:
    image: redis/redis-stack-server
    ports:
      - "6380:6379"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}