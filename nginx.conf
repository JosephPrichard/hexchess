worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    sendfile      on;
    keepalive_timeout  60;

    upstream hexchess-ui {
        server 127.0.0.1:5173;
    }

    upstream hexchess-svc {
        server 127.0.0.1:8081;
    }

    server {
        listen 8080;

        location /api/ {
            proxy_pass http://hexchess-svc/api/;
        }

        location / {
            proxy_pass http://hexchess-ui/;
        }
    }
}
